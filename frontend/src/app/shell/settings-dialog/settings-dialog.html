<div class="backdrop" (click)="close()">
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'Settings' | t"
    (click)="$event.stopPropagation()"
    (keydown.escape)="close()"
  >
    <aside class="pages">
      <h2>{{ 'Settings' | t }}</h2>
      <nav>
        @for (p of pages(); track p.id) {
          <button
            class="page"
            [class.current]="page() === p.id"
            [attr.aria-current]="page() === p.id ? 'page' : null"
            (click)="page.set(p.id)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              @switch (p.id) {
                @case ('general') {
                  <path
                    d="M9.8 4.9L10.3 2.3L13.7 2.3L14.2 4.9L15.5 5.5L17.7 3.9L20.1 6.3L18.5 8.5L19.1 9.8L21.7 10.3L21.7 13.7L19.1 14.2L18.5 15.5L20.1 17.7L17.7 20.1L15.5 18.5L14.2 19.1L13.7 21.7L10.3 21.7L9.8 19.1L8.5 18.5L6.3 20.1L3.9 17.7L5.5 15.5L4.9 14.2L2.3 13.7L2.3 10.3L4.9 9.8L5.5 8.5L3.9 6.3L6.3 3.9L8.5 5.5Z"
                  />
                  <circle cx="12" cy="12" r="3" />
                }
                @case ('editor') {
                  <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14" />
                }
                @case ('terminal') {
                  <rect x="2.5" y="4" width="19" height="16" rx="2" />
                  <path d="M6.5 9l3 3-3 3M12 15.5h5" />
                }
                @case ('git') {
                  <circle cx="7" cy="5.5" r="2" />
                  <circle cx="7" cy="18.5" r="2" />
                  <circle cx="17" cy="8.5" r="2" />
                  <path d="M7 7.5v9M17 10.5c0 3.5-4.5 4-8.2 6.4" />
                }
                @case ('ssh') {
                  <rect x="4" y="10.5" width="16" height="10" rx="2" />
                  <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5M12 14.5v2" />
                }
                @case ('signing') {
                  <path d="M4 19.5c2.5-1 4-4 5.5-4s1 3 3 3 2.5-2 4-2 2.5 1 3.5 1.5" />
                  <path d="M14.5 4.5l4 4L10 17l-4.5.5.5-4.5z" />
                }
                @case ('accounts') {
                  <circle cx="12" cy="8.5" r="3.5" />
                  <path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" />
                }
                @case ('tools') {
                  <path
                    d="M14.5 6.5a4 4 0 0 0 5 5l-8.5 8.5a2.1 2.1 0 0 1-3-3l8.5-8.5a4 4 0 0 0-2-2z"
                  />
                }
                @case ('about') {
                  <circle cx="12" cy="12" r="8.5" />
                  <path d="M12 11v5M12 8h.01" />
                }
              }
            </svg>
            {{ p.label }}
          </button>
        }
      </nav>
    </aside>

    <section class="content">
      <header>
        <h3>{{ title() }}</h3>
        <button class="r-bar-btn close" (click)="close()" [attr.aria-label]="'Close' | t">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
        </button>
      </header>

      <div class="rows">
        @switch (page()) {
          @case ('general') {
            <app-general-page />
          }
          @case ('editor') {
            <app-editor-page />
          }
          @case ('terminal') {
            <app-terminal-page />
          }
          @case ('git') {
            <app-git-page />
          }
          @case ('ssh') {
            <app-ssh-page />
          }
          @case ('signing') {
            <app-signing-page />
          }
          @case ('accounts') {
            <app-accounts-page />
          }
          @case ('tools') {
            <app-tools-page />
          }
          @case ('about') {
            <app-about-page />
          }
        }
      </div>
    </section>
  </div>
</div>
