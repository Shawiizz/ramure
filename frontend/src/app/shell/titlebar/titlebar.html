<header class="titlebar" data-tauri-drag-region>
  <img src="logo.svg" class="mark" alt="ramure" data-tauri-drag-region />

  <div class="tabs" role="tablist" data-tauri-drag-region>
    @for (tab of tabs.tabs(); track tab.id) {
      <div
        class="tab"
        role="tab"
        [class.active]="tab.id === tabs.activeId()"
        [attr.aria-selected]="tab.id === tabs.activeId()"
        [title]="tab.path ?? ''"
        (mousedown)="$event.button === 0 && tabs.activate(tab.id)"
        (auxclick)="auxClick($event, tab.id)"
      >
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="5" cy="3.5" r="1.6" />
          <circle cx="5" cy="12.5" r="1.6" />
          <circle cx="11" cy="5.5" r="1.6" />
          <path d="M5 5.1v5.8M11 7.1c0 2.4-3 2.6-5.4 4" />
        </svg>
        <span class="name">{{ tab.path ? split(tab.path).name : ('New tab' | t) }}</span>
        <button
          class="close-tab"
          (mousedown)="$event.stopPropagation()"
          (click)="tabs.close(tab.id)"
          [attr.aria-label]="'Close the tab (Ctrl+W)' | t"
          [title]="'Close the tab (Ctrl+W)' | t"
        >
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" /></svg>
        </button>
      </div>
    }
    <button
      class="new-tab"
      (click)="tabs.add()"
      [attr.aria-label]="'New tab (Ctrl+T)' | t"
      [title]="'New tab (Ctrl+T)' | t"
    >
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" /></svg>
    </button>
  </div>

  <app-workspace-menu />
  <button
    class="r-bar-btn settings"
    [class.open]="preferences.open()"
    (click)="preferences.open.set(true)"
    [attr.aria-label]="'Settings (Ctrl+,)' | t"
    [title]="'Settings (Ctrl+,)' | t"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M9.8 4.9L10.3 2.3L13.7 2.3L14.2 4.9L15.5 5.5L17.7 3.9L20.1 6.3L18.5 8.5L19.1 9.8L21.7 10.3L21.7 13.7L19.1 14.2L18.5 15.5L20.1 17.7L17.7 20.1L15.5 18.5L14.2 19.1L13.7 21.7L10.3 21.7L9.8 19.1L8.5 18.5L6.3 20.1L3.9 17.7L5.5 15.5L4.9 14.2L2.3 13.7L2.3 10.3L4.9 9.8L5.5 8.5L3.9 6.3L6.3 3.9L8.5 5.5Z"
      />
      <circle cx="12" cy="12" r="3" />
    </svg>
  </button>
  <app-profile-menu />

  <div class="window">
    <button class="win" (click)="minimize()" [attr.aria-label]="'Minimize' | t">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" /></svg>
    </button>
    <button class="win" (click)="toggleMaximize()" [attr.aria-label]="'Maximize' | t">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5h7v7h-7z" /></svg>
    </button>
    <button class="win close" (click)="close()" [attr.aria-label]="'Close' | t">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
    </button>
  </div>
</header>
