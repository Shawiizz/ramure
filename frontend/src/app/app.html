<app-titlebar />
<main>
  @if (repository.snapshot()) {
    <div class="workspace">
      <app-sidebar />
      @if (repository.diff()) {
        <app-diff-view />
      } @else {
        <app-history />
      }
      <app-details />
    </div>
  } @else {
    <app-welcome />
  }
</main>
<app-toast />
