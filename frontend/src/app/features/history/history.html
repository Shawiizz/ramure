<div class="history">
  <div class="columns" aria-hidden="true">
    <span class="graph" [style.width.px]="graphWidth()">{{ 'Graph' | t }}</span>
    <span class="message">{{ 'Commit message' | t }}</span>
    <span class="author">{{ 'Author' | t }}</span>
    <span class="date">{{ 'Date' | t }}</span>
    <span class="sha">SHA</span>
  </div>
  @if (lines().length) {
    <div class="rows" role="listbox" [attr.aria-label]="'History' | t">
      @for (line of lines(); track line.commit.id) {
        <button
          role="option"
          class="row"
          [id]="'commit-' + line.commit.id"
          [class.selected]="line.commit.id === repository.selectedId()"
          [attr.aria-selected]="line.commit.id === repository.selectedId()"
          (click)="repository.selectedId.set(line.commit.id)"
        >
          <app-graph-cell class="graph" [row]="line.row" [width]="graphWidth()" />
          <span class="message">
            @for (
              label of repository.labels().get(line.commit.id) ?? [];
              track label.kind + label.name
            ) {
              <span
                class="label"
                [class]="'label--' + label.kind"
                [class.head]="label.head"
                [style.--lane]="line.color"
                >{{ label.name }}</span
              >
            }
            <span class="summary">{{ line.commit.summary }}</span>
          </span>
          <span class="author">{{ line.commit.author }}</span>
          <span class="date">{{ when(line.commit.time) }}</span>
          <span class="sha r-mono">{{ line.commit.id.slice(0, 7) }}</span>
        </button>
      }
    </div>
  } @else {
    <p class="empty">{{ 'No commit yet on this branch.' | t }}</p>
  }
</div>
