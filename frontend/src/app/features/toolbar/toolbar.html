@if (repository.snapshot(); as snapshot) {
  <div class="toolbar">
    <div class="where">
      <div class="place">
        <span class="caption">{{ 'Repository' | t }}</span>
        <span class="value" [title]="snapshot.path">{{ snapshot.name }}</span>
      </div>
      @if (head(); as head) {
        <svg class="chevron" viewBox="0 0 8 12" aria-hidden="true"><path d="M2 1l4 5-4 5" /></svg>
        <div class="place">
          <span class="caption">{{ 'Branch' | t }}</span>
          <span class="value r-mono" [title]="'Current branch' | t">{{ head }}</span>
        </div>
      }
    </div>

    <div class="tools">
      <button
        class="tool"
        (click)="repository.exchangeWith('fetch')"
        [disabled]="repository.working()"
        [title]="'Fetch every remote' | t"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 9a5 5 0 1 0 1.5-3.6M3 3v3h3" />
        </svg>
        <span>{{ repository.exchange() === 'fetch' ? ('Fetching…' | t) : ('Fetch' | t) }}</span>
      </button>
      <button
        class="tool"
        (click)="repository.exchangeWith('pull')"
        [disabled]="repository.working()"
        [title]="'Bring the upstream’s commits here' | t"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v10M4 8l4 4 4-4M3 14h10" /></svg>
        <span>{{ repository.exchange() === 'pull' ? ('Pulling…' | t) : ('Pull' | t) }}</span>
        @if (upstream()?.behind) {
          <span class="count">{{ upstream()?.behind }}</span>
        }
      </button>
      <button
        class="tool"
        (click)="repository.exchangeWith('push')"
        [disabled]="repository.working()"
        [title]="'Send this branch’s commits to its upstream' | t"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14V4M4 8l4-4 4 4M3 2h10" /></svg>
        <span>{{ repository.exchange() === 'push' ? ('Pushing…' | t) : ('Push' | t) }}</span>
        @if (upstream()?.ahead) {
          <span class="count">{{ upstream()?.ahead }}</span>
        }
      </button>
      <div class="branching">
        <button
          class="tool"
          (click)="branching.set(!branching())"
          [disabled]="repository.working()"
          [title]="'A new branch at the selected commit' | t"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="5" cy="3.5" r="1.6" />
            <circle cx="5" cy="12.5" r="1.6" />
            <circle cx="11" cy="5.5" r="1.6" />
            <path d="M5 5.1v5.8M11 7.1c0 2.4-3 2.6-5.4 4" />
          </svg>
          <span>{{ 'Branch' | t }}</span>
        </button>
        @if (branching()) {
          <div class="backdrop" (click)="branching.set(false)"></div>
          <form class="r-popover" (submit)="$event.preventDefault(); createBranch()">
            <label class="r-field">
              <span>{{ 'New branch name' | t }}</span>
              <input
                #name
                class="r-mono"
                [value]="branchName()"
                (input)="branchName.set($any($event.target).value)"
                (keydown.escape)="branching.set(false)"
                spellcheck="false"
              />
            </label>
            <button class="r-btn r-btn--primary" type="submit" [disabled]="!branchName().trim()">
              {{ 'Create and switch' | t }}
            </button>
          </form>
        }
      </div>
      <button
        class="tool"
        (click)="repository.stash()"
        [disabled]="repository.working() || !repository.changes()"
        [title]="'Put every change aside, new files included' | t"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.5 9.5v4h11v-4M8 2v8M5 7l3 3 3-3" />
        </svg>
        <span>{{ 'Stash' | t }}</span>
      </button>
      <button
        class="tool"
        (click)="repository.restore(snapshot.stashes[0], true)"
        [disabled]="repository.working() || !snapshot.stashes.length"
        [title]="
          snapshot.stashes.length
            ? ('Bring back the last stash: {name}' | t: { name: snapshot.stashes[0].message })
            : ('No stash' | t)
        "
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.5 9.5v4h11v-4M8 10V2M5 5l3-3 3 3" />
        </svg>
        <span>{{ 'Pop' | t }}</span>
        @if (snapshot.stashes.length) {
          <span class="count">{{ snapshot.stashes.length }}</span>
        }
      </button>
    </div>
  </div>
}
