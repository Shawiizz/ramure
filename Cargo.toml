[workspace]
resolver = "2"
members = ["crates/*", "apps/ramure-desktop"]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
ramure-git = { path = "crates/ramure-git" }

gix = "0.89"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
