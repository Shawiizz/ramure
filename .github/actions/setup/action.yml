name: Setup
description: Rust, Node and pnpm, the frontend packages; on Linux, the libraries Tauri builds on

runs:
  using: composite
  steps:
    - name: Linux libraries (WebKitGTK, the system tray, D-Bus for the credential store)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
    - name: Rust (the version of rust-toolchain.toml)
      shell: pwsh
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Frontend packages
      shell: pwsh
      working-directory: frontend
      run: pnpm install --frozen-lockfile
